name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Every job targets the self-hosted `caltrans` runner, because the Databricks
# workspace and Lakebase are not reachable from GitHub-hosted runners.
#
# `runs-on:` matches LABELS, never the runner's name. The runner is *named*
# caltrans but its labels are exactly [self-hosted, macOS, ARM64], so
# `runs-on: caltrans` would queue forever with no error — the job would just sit
# pending. Do not add a `caltrans` entry to these lists until the label exists.
#
# If a second macOS ARM64 runner is ever registered, add a custom `caltrans`
# label to this one (Settings > Actions > Runners > caltrans > Labels) and switch
# every list in this file to [self-hosted, caltrans] to pin jobs back to it.
#
# NOTE: this is a macOS runner, so no `apt-get`, no GNU coreutils, and
# /bin/bash is 3.2 (no `mapfile`). Keep steps POSIX/BSD-safe.
#
# SECURITY: this workflow triggers on `pull_request`, so a fork PR now executes
# on the owner's machine rather than a disposable VM. The jobs below are
# deliberately secret-free, but consider requiring approval for fork PRs
# (Settings > Actions > "Require approval for all external contributors").
jobs:
  app:
    name: App lint, typecheck, unit tests
    runs-on: [self-hosted, macOS, ARM64]
    defaults:
      run:
        working-directory: caltrans-whatif
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Works on self-hosted macOS ARM64: setup-node publishes darwin-arm64 builds, and on a
      # self-hosted runner it installs into RUNNER_TOOL_CACHE, which persists — so after the
      # first job this resolves from disk instead of downloading.
      #
      # NO `cache: npm` ON PURPOSE. It is not a no-op that we are skipping for tidiness; it
      # actively costs wall clock here, and the cost lands in the POST step:
      #
      #   * `cache: npm` makes setup-node register a post step (`dist/cache-save/index.js`)
      #     that tars the npm cache directory and UPLOADS it to the GitHub Actions cache
      #     SERVICE over the network. The cached PATH is local (~/.npm); the cache BACKEND is
      #     remote. Those are different things, and an earlier version of this comment
      #     conflated them.
      #   * On a GitHub-hosted VM that upload is the entire point — the machine is destroyed,
      #     so the cache has to be shipped off-box to survive.
      #   * This runner is PERSISTENT. ~/.npm lives in the runner user's home, OUTSIDE
      #     $GITHUB_WORKSPACE, so `git clean -ffdx` never touches it and it survives between
      #     jobs on local disk. `npm ci` reads it directly and is fast either way. The remote
      #     copy restores, over the network, bytes that never left the machine.
      #   * The upload fires on a cache MISS (`if (primaryKey === state) return;` in
      #     cache-save.ts). Actions caches are branch-scoped and setup-node passes no
      #     restoreKeys for npm, so every new PR branch misses, as does anything evicted by
      #     the 7-day idle rule or the 10 GB repo ceiling. It also burns that quota.
      #   * This runner takes ONE job at a time, so a post step is not free background work:
      #     it delays the next queued job 1:1.
      #
      # Without a `cache:` input the post step short-circuits immediately and is measurably
      # free. IF THIS REPO EVER MOVES BACK TO GITHUB-HOSTED RUNNERS, restore
      # `cache: npm` + `cache-dependency-path: caltrans-whatif/package-lock.json` — there the
      # tradeoff inverts and the upload is worth it.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # `postinstall` runs `typegen`, which needs a live warehouse. It is written to
      # be non-fatal (`|| echo ...`) and falls back to the committed
      # shared/appkit-types/analytics.d.ts, so `npm ci` succeeds without secrets.
      #
      # Persistent-runner note: `npm ci` deletes node_modules before installing,
      # and actions/checkout@v4 defaults to `clean: true` (`git clean -ffdx` +
      # `git reset --hard`), which also wipes untracked and ignored leftovers such
      # as node_modules/, dist/ and .databricks/ from a previous run. Do not set
      # `clean: false` on this runner without re-reading those assumptions.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Lint AppKit structure
        run: npm run lint:ast-grep

      - name: Typecheck
        run: npm run typecheck

      # `npm test` also runs test:smoke, which needs a browser download and a live
      # warehouse. Call vitest directly so this job stays secret-free.
      - name: Unit tests
        run: npx vitest run

  scenario-sql:
    name: Scenario SQL drift check
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # actions/python-versions publishes python-3.12.x-darwin-arm64, so this
      # resolves on Apple Silicon. It also means the job does not depend on the
      # bare-macOS /usr/bin/python3 (an Xcode Command Line Tools stub).
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # tools/ is stdlib-only, so this gate needs no installs.
      - name: Check rendered scenario SQL
        run: python -m tools.scenario_sql.render --check

  bundle-validate:
    name: Databricks bundle validate
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # No floating v1 tag exists upstream, so pin a full version. Pinning the
      # action at vX.Y.Z also pins the CLI it installs (via the repo VERSION file).
      #
      # Safe on self-hosted macOS ARM64: the action's setup_release.sh maps
      # RUNNER_OS=macOS -> darwin and RUNNER_ARCH=ARM64 -> arm64, and
      # databricks_cli_1.7.0_darwin_arm64.zip is published upstream. It needs only
      # curl and unzip (both stock on macOS), uses no sudo, and installs under
      # $RUNNER_TEMP while prepending to $GITHUB_PATH — so it leaves no state
      # behind between runs on a persistent box.
      - name: Set up Databricks CLI
        uses: databricks/setup-cli@v1.7.0

      # `bundle validate` parses and type-checks the bundle locally, but the final
      # step resolves workspace auth, which is intentionally unavailable to
      # fork-safe CI. Treat an auth-resolution failure as success: every syntactic
      # and schema error is still caught before that point.
      - name: Validate synthetic traffic bundle
        run: .github/scripts/bundle-validate.sh .

      - name: Validate what-if app bundle
        run: .github/scripts/bundle-validate.sh caltrans-whatif
