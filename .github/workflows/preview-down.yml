name: Preview down

# Tear down a PR's preview when the PR closes.
#
# `pull_request: closed` fires on BOTH merge and plain close — GitHub has no separate "merged"
# event — so this single path must handle both, and it does not inspect `merged` at all: a
# preview is disposable either way.
#
# This is a COST control, not hygiene. An idle Lakebase branch floors at ~0.5 CU with a 24h
# suspend timeout that cannot be lowered, and a project allows only 10 unarchived branches, so a
# leaked branch bills indefinitely and eats a slot some future PR needs.
on:
  pull_request:
    types: [closed]

# A DISTINCT concurrency group from preview-up, on purpose. The previous comment here claimed
# this "serializes against preview-up for the same PR, and does NOT cancel" — that was exactly
# backwards, and the bug it described was the leak this workflow exists to prevent.
#
# `cancel-in-progress` is a property of the INCOMING run, not of the run already in flight. Both
# workflows previously used `group: preview-<n>`, so they contended — and preview-up sets
# `cancel-in-progress: true`. A `reopened` event (or any push to a reopened PR) starts preview-up,
# which then CANCELS AN IN-FLIGHT TEARDOWN. Setting `false` here protected nothing: it only meant
# "this run will not cancel others", never "others may not cancel this run".
#
# A cancelled teardown is a Lakebase branch that bills indefinitely and holds one of the
# project's 10 unarchived slots. So teardown gets its own group name, which no other workflow
# uses: nothing can preempt it, and `cancel-in-progress: false` below now does what it says,
# serializing concurrent teardowns of the SAME PR against each other (a close/reopen/close
# sequence) instead of racing two deletes.
#
# The cross-workflow ordering the old comment wanted is not actually needed: teardown.sh is
# idempotent, asserts the resolved app name and state root are PR-scoped before destroying, and
# treats "already gone" as success. And the events are mutually exclusive in practice —
# preview-up runs on opened/synchronize/reopened, preview-down only on closed.
concurrency:
  group: preview-teardown-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  teardown:
    # Forks never got a preview (preview-up skips them), so there is nothing to tear down and no
    # secrets to do it with.
    if: github.event.pull_request.head.repo.full_name == github.repository
    # LABELS of the self-hosted runner, not its name — see the longer note in preview-up.yml.
    # Teardown especially must not sit unschedulable in a queue: an unrun teardown is the leak
    # this workflow exists to prevent.
    runs-on: [self-hosted, macOS, ARM64]
    environment: preview
    timeout-minutes: 30

    steps:
      # Checks out the PR's merge/head ref, which still exists at close time. Only the scripts
      # are needed, and they read no PR-specific state beyond the number.
      #
      # `clean: true` matters on a persistent runner: teardown asserts on `bundle validate` output,
      # and a stale local .databricks/ state dir left by an earlier run is exactly the kind of
      # leftover that could make those assertions describe the wrong deployment.
      - uses: actions/checkout@v4
        with:
          clean: true

      # THIS STEP IS THE LEAK GUARD. jq is required and was installed by nothing: Ubuntu images
      # ship it, macOS does not. teardown.sh does `require_cmd databricks jq` and exits 127
      # without it, and ./.github/actions/databricks-setup pipes `databricks current-user me`
      # through jq in its "Verify identity" step -- so this must run BEFORE that action.
      #
      # Consequence of getting this wrong: teardown dies before deleting anything and the paid
      # Lakebase branch leaks SILENTLY. An idle branch floors at ~0.5 CU with a 24h suspend
      # timeout that cannot be lowered, and it holds one of the project's 10 unarchived slots.
      #
      # UNLIKE libpq, jq is NOT keg-only: brew links it into <prefix>/bin, already on PATH. No
      # $GITHUB_PATH export -- a <prefix>/opt/jq/bin does not exist.
      #
      # Idempotent and sudo-free; the `command -v jq` guard no-ops on a provisioned box.
      - name: Ensure jq is available
        run: |
          set -euo pipefail

          if command -v jq >/dev/null 2>&1; then
            echo "jq already on PATH: $(command -v jq) ($(jq --version))"
            exit 0
          fi

          if ! command -v brew >/dev/null 2>&1; then
            for candidate in /opt/homebrew/bin/brew /usr/local/bin/brew; do
              if [ -x "$candidate" ]; then
                eval "$("$candidate" shellenv)"
                break
              fi
            done
          fi

          if ! command -v brew >/dev/null 2>&1; then
            echo "::error title=Runner setup incomplete::Homebrew is not installed on the self-hosted runner 'caltrans', so jq cannot be installed and this preview CANNOT be torn down."
            echo "The Lakebase branch for this PR is still billing. Install Homebrew on that machine, then re-run this workflow:" >&2
            echo '  /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"' >&2
            echo "  brew install jq" >&2
            exit 1
          fi

          echo "Installing jq via Homebrew..."
          brew install jq

      # Prove it in a fresh step rather than trusting the installing shell's environment. A red
      # run here is the loud version of the failure; the quiet version is a branch that bills
      # forever.
      - name: Assert jq is on PATH
        run: |
          set -euo pipefail
          if ! command -v jq >/dev/null 2>&1; then
            echo "::error title=jq missing::jq is not on PATH, so teardown.sh cannot run and this PR's Lakebase branch will keep billing."
            echo "On the self-hosted runner 'caltrans', run: brew install jq" >&2
            echo "Then re-run this workflow, or clean up by hand with scripts/preview/teardown.sh." >&2
            echo "PATH was: $PATH" >&2
            exit 1
          fi
          echo "jq resolved: $(command -v jq)"
          jq --version

      - uses: ./.github/actions/databricks-setup
        with:
          databricks-host: ${{ secrets.DATABRICKS_HOST }}
          databricks-token: ${{ secrets.DATABRICKS_TOKEN }}

      # No `npm ci` here: teardown never builds the app.
      - name: Destroy preview app and Lakebase branch
        id: teardown
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: scripts/preview/teardown.sh "$PR_NUMBER"

      # Leave the sticky comment in place but mark it torn down, so anyone reopening the PR later
      # does not follow a stale link to an app that no longer exists. Best-effort: a failure to
      # edit a comment must not mask the teardown result.
      - name: Mark sticky comment torn down
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const MARKER = '<!-- caltrans-preview-comment -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.body?.includes(MARKER));
            if (!existing) { core.info('No sticky preview comment to update'); return; }

            const note = '### 🧹 Preview torn down\n\n'
              + 'The preview app and its Lakebase branch were deleted when this PR closed. '
              + 'Reopening the PR or pushing to it will build a fresh preview from `production`.\n\n'
              + '<details><summary>Previous preview details</summary>\n\n';
            const body = `${MARKER}\n${note}${existing.body.replace(MARKER, '').trim()}\n\n</details>`;
            await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });

      # teardown.sh already exits non-zero only when resources are still present, so a red run
      # here means a genuine leak that needs a human. Spell that out — the whole point of making
      # "nothing to clean up" exit 0 is that a failure on a closed PR should be believable.
      - name: Explain failure
        if: failure() && steps.teardown.outcome == 'failure'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "### ⚠️ Preview teardown did not fully succeed"
            echo
            echo "Resources for PR #${PR_NUMBER} may still exist and be billing."
            echo "Check and clean up manually:"
            echo
            echo '```bash'
            echo "databricks apps get caltrans-whatif-pr-${PR_NUMBER}"
            echo "databricks postgres get-branch projects/caltrans-app/branches/pr-${PR_NUMBER}"
            echo "scripts/preview/teardown.sh ${PR_NUMBER}   # safe to re-run"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
