name: Preview up

# Create/refresh a per-PR preview: a copy-on-write Lakebase branch plus an app deployed against
# it, then a sticky comment pointing at both.
#
# `synchronize` fires on every push to the PR, so everything downstream is written to be
# idempotent — the Lakebase branch is reused, not recreated, and the comment is edited in place.
#
# The real logic lives in scripts/preview/*.sh, not here. Ordering between the phases is subtle
# and load-bearing (see the header of scripts/preview/deploy.sh); keeping it in one reviewable
# script beats spreading it across YAML steps where the constraints are invisible.
on:
  pull_request:
    types: [opened, synchronize, reopened]

# Serialize per PR. cancel-in-progress because on a rapid push sequence only the newest commit
# matters; a superseded deploy racing the new one would leave the preview on an older build.
#
# The group name is preview-UP-specific and must STAY distinct from preview-down's. They used to
# share `preview-<n>`, which meant an incoming preview-up could cancel an in-flight teardown —
# `cancel-in-progress` is a property of the INCOMING run, so preview-down's `false` did not
# protect it. `reopened` is the concrete trigger for that: it starts a preview-up while a
# teardown from the preceding `closed` may still be running, and a cancelled teardown leaks a
# billing Lakebase branch. See the longer note in preview-down.yml.
concurrency:
  group: preview-up-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write   # for the sticky comment

jobs:
  preview:
    # Forked-PR runs would receive no secrets, so the deploy would fail confusingly halfway
    # through. Skip them explicitly instead. (A `pull_request` trigger also gives forks a
    # read-only token, so the sticky comment would fail too.)
    if: github.event.pull_request.head.repo.full_name == github.repository
    # Must be the self-hosted runner: the Databricks workspace and Lakebase are not reachable
    # from GitHub-hosted runners.
    #
    # These are LABELS, not the runner's name. The registered runner is *named* `caltrans`, but
    # `runs-on:` only ever matches labels, so `runs-on: caltrans` would queue forever waiting for
    # a label nobody has. [self-hosted, macOS, ARM64] is the label set that runner actually
    # carries, and today it is the only runner carrying it, so this targets it uniquely.
    #
    # If a second macOS ARM64 runner is ever registered, this list stops being unique. At that
    # point add a custom `caltrans` LABEL to this runner (Settings -> Actions -> Runners -> the
    # runner -> Labels) and narrow this to [self-hosted, caltrans]. Do not pre-emptively write
    # that label here — it does not exist yet, and a job asking for it would never be picked up.
    runs-on: [self-hosted, macOS, ARM64]
    environment: preview
    timeout-minutes: 45

    steps:
      # `clean: true` is the default, but state it explicitly: this runner is PERSISTENT, so the
      # workspace is whatever the previous run left behind. checkout's `git clean -ffdx` +
      # `git reset --hard` is the only thing removing a stale node_modules/, a stale .databricks/
      # local bundle state dir, and — importantly — the app.yaml edit that strip-self-url.sh makes
      # in-tree. Without it those would accumulate across runs.
      - uses: actions/checkout@v4
        with:
          clean: true

      # jq is required and was installed by NOTHING. Ubuntu images ship it; macOS does not.
      # create-branch.sh / deploy.sh both `require_cmd databricks jq` (exit 127), and
      # ./.github/actions/databricks-setup pipes `databricks current-user me` through jq in its
      # own "Verify identity" step -- which is why this must come BEFORE that action, not after.
      #
      # UNLIKE libpq, jq is NOT keg-only: brew symlinks it into <prefix>/bin, which is already on
      # PATH. So there is deliberately no $GITHUB_PATH export here -- copying libpq's export logic
      # would point at a <prefix>/opt/jq/bin that does not exist.
      #
      # Idempotent and sudo-free: the runner is persistent, so on an already-provisioned box the
      # `command -v jq` guard makes this a no-op rather than a reinstall every run.
      - name: Ensure jq is available
        run: |
          set -euo pipefail

          if command -v jq >/dev/null 2>&1; then
            echo "jq already on PATH: $(command -v jq) ($(jq --version))"
            exit 0
          fi

          if ! command -v brew >/dev/null 2>&1; then
            # brew may be installed but absent from a non-login shell's PATH.
            for candidate in /opt/homebrew/bin/brew /usr/local/bin/brew; do
              if [ -x "$candidate" ]; then
                eval "$("$candidate" shellenv)"
                break
              fi
            done
          fi

          if ! command -v brew >/dev/null 2>&1; then
            echo "::error title=Runner setup incomplete::Homebrew is not installed on the self-hosted runner 'caltrans', so jq cannot be installed."
            echo "Install it once on that machine as the runner user, then re-run:" >&2
            echo '  /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"' >&2
            echo "  brew install jq" >&2
            exit 1
          fi

          echo "Installing jq via Homebrew..."
          brew install jq

      # Separate step so the assertion is real: brew's symlink lands in a directory already on
      # PATH, but proving it in a FRESH step rules out anything that only worked because of the
      # installing shell's own environment. Failing here beats `require_cmd ... jq` exiting a bare
      # 127 mid-deploy, or -- worse, on teardown -- leaking a billing Lakebase branch.
      - name: Assert jq is on PATH
        run: |
          set -euo pipefail
          if ! command -v jq >/dev/null 2>&1; then
            echo "::error title=jq missing::jq is not on PATH, so the preview scripts and the databricks-setup identity check cannot run."
            echo "On the self-hosted runner 'caltrans', run: brew install jq" >&2
            echo "PATH was: $PATH" >&2
            exit 1
          fi
          echo "jq resolved: $(command -v jq)"
          jq --version

      - uses: ./.github/actions/databricks-setup
        with:
          databricks-host: ${{ secrets.DATABRICKS_HOST }}
          databricks-token: ${{ secrets.DATABRICKS_TOKEN }}

      # Node is needed because `apps deploy` builds the app (tsc + vite) as part of its
      # validation pipeline. The repo pins no Node version anywhere — no engines field, no
      # .nvmrc — so 22 is chosen here to match the version the app was developed against.
      #
      # Works as-is on self-hosted macOS ARM64: setup-node publishes darwin-arm64 Node builds, and
      # on a self-hosted runner it installs into RUNNER_TOOL_CACHE (persisting across runs, so
      # after the first job this is a cache hit rather than a download).
      #
      # NO `cache: npm`. An earlier version of this comment had the mechanism right — it does
      # write to the actions/cache backend rather than a local dir — but treated that as a pure
      # win. It is not, on a persistent runner: that remote write is a POST step that tars the
      # npm cache dir and uploads it, and ~/.npm already survives here on local disk (it lives
      # outside $GITHUB_WORKSPACE, so checkout's `git clean -ffdx` cannot reach it). `npm ci`
      # below is fast because of that local directory, not because of the remote copy — so the
      # upload buys nothing and is paid at the end of every job that misses the cache key, on a
      # runner that runs one job at a time. Restore `cache: npm` +
      # `cache-dependency-path: caltrans-whatif/package-lock.json` if this ever moves back to a
      # GitHub-hosted runner. See the longer note in ci.yml.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The preview path shells out to python3: scripts/preview/strip-self-url.sh does its
      # in-place app.yaml edit in Python (deploy.sh calls it before either deploy phase), and
      # scripts/lakebase/apply.sh -- reached via deploy.sh phase 3 -- does `require_cmd python3`
      # and uses it to parse the CLI's JSON.
      #
      # Bare macOS /usr/bin/python3 is an Xcode Command Line Tools stub that can prompt to
      # install or be missing entirely, so provide a real interpreter exactly as deploy-main.yml
      # and ci.yml already do — all three now share the one composite action, so they cannot
      # drift apart.
      #
      # Homebrew, not actions/setup-python: that action hardcodes /Users/runner/hostedtoolcache on
      # macOS and overwrites RUNNER_TOOL_CACHE in-process, so on this runner it fails with
      # `mkdir: /Users/runner: Permission denied` and no env: override can prevent it. This site
      # had not yet run red only because preview-up needs a PR label to trigger.
      - name: Ensure Python
        uses: ./.github/actions/ensure-python

      # deploy.sh phase 3 shells out to scripts/lakebase/apply.sh, which hard-requires `psql`
      # (`require_cmd psql` -> exit 127). Without a resolvable psql the grants step dies and the
      # preview app deploys LOOKING healthy while every advisor write fails with 42501 at runtime.
      # That silent failure mode is the entire reason this step exists, so it ends by PROVING psql
      # resolves rather than assuming the install worked.
      #
      # macOS/ARM64, not Debian: there is no apt-get here. Homebrew's `libpq` provides psql
      # (`postgresql@17` would too, but it also drags in a server we do not want on a CI box).
      #
      # libpq IS keg-only ("it conflicts with PostgreSQL"), so brew deliberately does NOT symlink
      # psql into <prefix>/bin — the explicit $GITHUB_PATH export below is required, not
      # belt-and-braces. (Contrast the jq step above: jq is not keg-only and needs no export.)
      #
      # The prefix is READ FROM `brew --prefix`, never hardcoded: it is /opt/homebrew on Apple
      # Silicon but /usr/local on Intel, and can be custom. This previously pinned /opt/homebrew,
      # which silently breaks on any other layout — deploy-main.yml already derived it, and these
      # two now agree.
      #
      # The runner is persistent, so the install is guarded: on an already-provisioned box every
      # branch here is a no-op and the step just re-exports PATH (which must happen every run —
      # $GITHUB_PATH does not persist between jobs).
      #
      # No `sudo` anywhere: a self-hosted runner may well not have passwordless sudo, and `brew`
      # owns its prefix as the invoking user, so it must NOT be run with sudo.
      - name: Ensure psql is available
        run: |
          set -euo pipefail

          # Resolve brew first — the libpq path is derived from its prefix, so this has to come
          # before any use of LIBPQ_BIN. brew may be installed but missing from a non-login
          # shell's PATH, so try the standard prefixes before concluding it is absent.
          if ! command -v brew >/dev/null 2>&1; then
            for candidate in /opt/homebrew/bin/brew /usr/local/bin/brew; do
              if [ -x "$candidate" ]; then
                eval "$("$candidate" shellenv)"
                break
              fi
            done
          fi

          # With no brew there is no prefix to derive. If psql happens to be on PATH already
          # (a system Postgres, or an earlier $GITHUB_PATH entry) that is still fine.
          if ! command -v brew >/dev/null 2>&1; then
            if command -v psql >/dev/null 2>&1; then
              echo "psql already on PATH: $(command -v psql) ($(psql --version)); brew not needed"
              exit 0
            fi
            echo "::error::Homebrew is not installed on this self-hosted runner, so psql cannot be installed automatically."
            echo "::error::Install it once on the 'caltrans' runner: /bin/bash -c \"\$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)\" && brew install libpq"
            echo "::error::See docs/PREVIEW_ENVIRONMENTS.md (runner prerequisites)."
            exit 1
          fi

          BREW_PREFIX="$(brew --prefix)"
          LIBPQ_BIN="$BREW_PREFIX/opt/libpq/bin"

          if command -v psql >/dev/null 2>&1; then
            echo "psql already on PATH: $(command -v psql)"
          elif [[ -x "$LIBPQ_BIN/psql" ]]; then
            # Installed keg-only by a previous run; this is only a PATH problem.
            echo "psql already installed keg-only at $LIBPQ_BIN/psql; only PATH was missing"
          else
            echo "Installing libpq (provides psql) via Homebrew..."
            brew install libpq
          fi

          # Ask brew directly if the derived path is not there — a formula can report a prefix
          # that does not match <prefix>/opt/<name> under unusual installs.
          if [[ ! -x "$LIBPQ_BIN/psql" ]]; then
            LIBPQ_BIN="$(brew --prefix libpq 2>/dev/null || true)/bin"
          fi

          # Export for every LATER step in this job. Harmless if psql came from elsewhere on PATH;
          # prepending would be wrong (it would shadow an intentionally-chosen psql), appending is
          # enough because $GITHUB_PATH entries precede the inherited PATH anyway.
          if [[ -d "$LIBPQ_BIN" ]]; then
            echo "$LIBPQ_BIN" >>"$GITHUB_PATH"
          fi

          # Fail LOUDLY and actionably now rather than as exit 127 inside apply.sh three steps
          # later, where the symptom is "grants never applied" and the app still looks healthy.
          # $GITHUB_PATH only affects subsequent steps, so probe this step's own PATH explicitly.
          if ! PATH="$LIBPQ_BIN:$PATH" command -v psql >/dev/null 2>&1; then
            echo "::error::psql is still not resolvable after the install attempt."
            echo "::error::Looked for it on PATH and at $LIBPQ_BIN/psql (brew prefix: $BREW_PREFIX)."
            echo "::error::Inspect the runner with: brew --prefix libpq && ls \"\$(brew --prefix libpq)/bin\""
            echo "::error::Otherwise run 'brew install libpq' on the 'caltrans' runner and re-run this job."
            exit 1
          fi
          PATH="$LIBPQ_BIN:$PATH" psql --version

      - name: Install app dependencies
        working-directory: caltrans-whatif
        # `npm ci` runs postinstall -> typegen, which needs a live warehouse. It is deliberately
        # non-fatal in package.json (generated types are committed), so a failure there is fine
        # here; the fatal typegen happens later inside `apps deploy`, after UC grants exist.
        run: npm ci

      - name: Create or reuse the Lakebase branch
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: scripts/preview/create-branch.sh "$PR_NUMBER"

      - name: Deploy the preview app
        id: deploy
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: scripts/preview/deploy.sh "$PR_NUMBER"

      # Values go through `env:` rather than being interpolated into the script text, so the
      # shell never re-parses them. They come from our own naming and the Databricks API, but
      # `${{ }}` inside `run:` is textual substitution and this is the habit worth keeping.
      - name: Render comment body
        id: body
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          APP_NAME: ${{ steps.deploy.outputs.app_name }}
          APP_URL: ${{ steps.deploy.outputs.app_url }}
          SP_CLIENT_ID: ${{ steps.deploy.outputs.sp_client_id }}
        run: |
          set -euo pipefail
          {
            echo 'text<<PREVIEW_COMMENT_EOF'
            scripts/preview/comment-body.sh "$PR_NUMBER" "$APP_NAME" "$APP_URL" "$SP_CLIENT_ID"
            echo 'PREVIEW_COMMENT_EOF'
          } >>"$GITHUB_OUTPUT"

      # Sticky: find the bot's existing comment by its hidden marker and EDIT it. Posting a new
      # comment per push would bury the PR conversation under near-identical notices — and since
      # only the newest one is accurate, the older ones become actively misleading.
      - name: Upsert sticky preview comment
        uses: actions/github-script@v7
        env:
          BODY: ${{ steps.body.outputs.text }}
        with:
          script: |
            const MARKER = '<!-- caltrans-preview-comment -->';
            const body = `${MARKER}\n${process.env.BODY}`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.body?.includes(MARKER));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              core.info(`Updated sticky comment ${existing.id}`);
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
              core.info('Created sticky comment');
            }

      - name: Summary
        if: always()
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          APP_NAME: ${{ steps.deploy.outputs.app_name }}
          APP_URL: ${{ steps.deploy.outputs.app_url }}
          BRANCH_PATH: ${{ steps.deploy.outputs.branch_path }}
        run: |
          {
            echo "### Preview for PR #${PR_NUMBER}"
            echo
            echo "- App: ${APP_NAME:-(not deployed)}"
            echo "- URL: ${APP_URL:-(none)}"
            echo "- Lakebase branch: \`${BRANCH_PATH:-(none)}\`"
          } >>"$GITHUB_STEP_SUMMARY"
